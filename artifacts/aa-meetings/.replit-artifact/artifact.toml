kind = "web"
previewPath = "/"
title = "AA Meetings"
version = "1.0.0"
id = "artifacts/aa-meetings"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19372

[services.development]
run = "pnpm --filter @workspace/aa-meetings run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aa-meetings", "run", "build" ]
publicDir = "artifacts/aa-meetings/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19372"
BASE_PATH = "/"
